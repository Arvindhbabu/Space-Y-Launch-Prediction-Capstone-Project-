version: "3.8"

services:
  spacey-app:
    build: .
    container_name: spacey-intelligence-dashboard
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  spacey-api:
    build: .
    container_name: spacey-intelligence-api
    ports:
      - "8000:8000"
    command: ["uvicorn", "spacey.services.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
