name: SpaceY Intelligence CI

on:
  push:
    branches: [master, "upgrade/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Report runtime
        run: |
          python -c "import sys, sklearn, pandas, numpy; print(sys.executable); print('sklearn', sklearn.__version__); print('pandas', pandas.__version__); print('numpy', numpy.__version__)"
      - name: Validate dependency graph
        run: python -m pip check
      - name: Run tests
        run: python -m pytest tests/ -v

  container-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --tag spacey-intelligence:ci .
