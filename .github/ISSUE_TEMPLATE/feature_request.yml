name: Feature request
description: Suggest a focused improvement with a clear user or research benefit.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What limitation or user need does this address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or capability you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches might address the same need?
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and acceptance criteria
      description: Include examples, data needs, accessibility considerations, or testable criteria.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This proposal preserves the project's educational, non-operational scope.
          required: true
